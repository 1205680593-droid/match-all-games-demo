<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Featured Matches Demo</title>
  <style>
    :root {
      color-scheme: light;
      --red: #f5222d;
      --red-soft: #fff0f1;
      --ink: #121212;
      --muted: #8b8d93;
      --line: #ececef;
      --soft: #f6f7f9;
      --green: #0e9f6e;
      --app-width: 430px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #eef0f3;
      color: var(--ink);
      letter-spacing: 0;
    }
    button { font: inherit; color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, var(--app-width));
      height: 100dvh;
      margin: 0 auto;
      background: #fff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(30, 35, 50, .10);
    }

    .status-bar {
      height: 48px;
      flex: 0 0 48px;
      padding: 13px 22px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
    }
    .status-icons { display: flex; gap: 7px; align-items: center; font-size: 13px; }
    .battery { width: 23px; height: 11px; border: 1.8px solid #111; border-radius: 3px; padding: 1.5px; position: relative; }
    .battery::after { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 5px; background: #111; border-radius: 0 2px 2px 0; }
    .battery span { display: block; width: 80%; height: 100%; background: #111; border-radius: 1px; }

    .topbar {
      height: 62px;
      flex: 0 0 62px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .top-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--soft);
      display: grid; place-items: center; cursor: pointer; font-size: 20px;
    }
    .avatar { background: #1a1a1a; color: white; font-size: 13px; font-weight: 800; }

    .explore-tabs {
      align-self: stretch;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .explore-tab {
      align-self: stretch; border: 0; background: transparent; padding: 2px 0 0;
      color: #9a9ba0; font-size: 18px; font-weight: 650; position: relative; cursor: pointer;
    }
    .explore-tab.active { color: var(--ink); font-weight: 750; }
    .explore-tab.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
      border-radius: 2px 2px 0 0; background: var(--red);
    }
    .explore-tab:focus { outline: none; }
    .explore-tab:focus-visible { box-shadow: inset 0 -3px var(--red); }

    .date-strip {
      height: 74px;
      flex: 0 0 74px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 12px 7px;
      background: #fff;
      z-index: 14;
    }
    .date-btn {
      border: 0; background: transparent; border-radius: 7px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: #999ba0; font-size: 13px;
    }
    .date-btn strong { font-size: 17px; font-weight: 650; color: #73757a; }
    .date-btn.active { background: var(--red-soft); color: var(--red); font-weight: 700; }
    .date-btn.active strong { color: var(--red); }

    .live-toolbar {
      display: none; height: 62px; flex: 0 0 62px; padding: 8px 14px;
      grid-template-columns: 132px minmax(110px, 1fr);
      align-items: center; gap: 8px; background: #fff; border-bottom: 1px solid var(--line);
    }
    .live-tool {
      min-width: 0; height: 42px; border: 0; border-radius: 7px; background: var(--soft);
      display: flex; align-items: center; justify-content: center; gap: 7px;
      color: #686a70; font-size: 13px; font-weight: 650; cursor: pointer;
      white-space: nowrap; overflow: hidden;
    }
    .live-tool.icon-only { font-size: 20px; padding: 0; }
    .live-tool.active { color: var(--red); background: var(--red-soft); }
    .app.live-page .search-action { display: none; }
    .all-games-live-entry {
      display: none; height: 150px; padding: 6px 0 8px;
      background: #fff; border-bottom: 1px solid var(--line);
    }
    .app.live-page .all-games-live-entry { display: block; }
    .live-preview-heading {
      height: 44px; padding: 2px 14px; display: flex; align-items: center;
    }
    .live-preview-title {
      width: 100%; height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--soft);
      display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 750; cursor: pointer;
    }
    .live-preview-title::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .live-preview-title strong {
      min-width: 24px; height: 22px; padding: 0 6px; border-radius: 6px;
      display: grid; place-items: center; background: var(--red); color: #fff; font-size: 12px;
    }
    .live-preview-action { margin-left: auto; display: flex; align-items: center; gap: 5px; color: #777980; font-size: 12px; font-weight: 650; }
    .live-preview-action b { font-size: 18px; font-weight: 500; line-height: 1; }
    .live-preview-track {
      height: 98px; padding: 2px 14px 4px; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; scroll-padding-inline: 14px; overscroll-behavior-x: contain; scrollbar-width: none;
    }
    .live-preview-track::-webkit-scrollbar { display: none; }
    .live-preview-match, .live-status-entry {
      flex: 0 0 auto; height: 90px; border: 1px solid #e7e8eb; border-radius: 7px;
      scroll-snap-align: start; background: #fff; cursor: pointer;
    }
    .live-preview-match {
      width: 196px; padding: 6px 10px; display: block; text-align: left;
      box-shadow: 0 1px 3px rgba(20, 24, 32, .06);
    }
    .live-preview-match.featured-match {
      padding-left: 7px; border-left: 3px solid var(--red); border-color: #ffc8cb #ffc8cb #ffc8cb var(--red);
      background: var(--red-soft);
    }
    .live-preview-card-head { height: 22px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
    .live-preview-league { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #777980; font-size: 10px; font-weight: 700; }
    .live-preview-minute { margin-left: auto; flex: 0 0 auto; color: var(--red); font-size: 12px; font-weight: 750; }
    .live-preview-teams { min-width: 0; display: block; padding-top: 2px; }
    .live-preview-team {
      height: 29px; display: grid; grid-template-columns: 22px minmax(0, 1fr) 16px; align-items: center; gap: 5px;
    }
    .live-preview-team img { width: 21px; height: 21px; object-fit: contain; }
    .live-preview-team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
    .live-preview-team strong { color: var(--red); font-size: 13px; text-align: right; }
    .live-status-entry {
      width: 112px; padding: 8px 10px; display: flex; justify-content: center; align-items: center;
      color: #686a70; background: var(--soft); text-align: center;
    }
    .live-status-entry strong { font-size: 13px; color: var(--ink); }

    .live-popup-backdrop {
      position: fixed; z-index: 44; inset: 0; background: rgba(18, 20, 26, .36);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .live-popup-backdrop.show { opacity: 1; pointer-events: auto; }
    .live-popup {
      position: fixed; z-index: 45; left: 50%; bottom: 0; width: min(100%, var(--app-width));
      height: min(88dvh, 760px); transform: translate(-50%, 105%);
      display: flex; flex-direction: column; overflow: hidden;
      background: #fff; border-radius: 14px 14px 0 0;
      box-shadow: 0 18px 44px rgba(24, 28, 38, .24); transition: transform .28s ease;
    }
    .live-popup.show { transform: translate(-50%, 0); }
    .live-popup-header {
      min-height: 62px; flex: 0 0 62px; padding: env(safe-area-inset-top) 16px 0;
      display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line);
    }
    .live-popup-header h2 { margin: 0; font-size: 19px; font-weight: 760; }
    .live-popup-total {
      min-width: 28px; height: 28px; padding: 0 7px; border-radius: 7px;
      display: grid; place-items: center; background: var(--red); color: #fff; font-size: 12px; font-weight: 750;
    }
    .live-popup-close {
      width: 34px; height: 34px; margin-left: auto; border: 0; border-radius: 50%;
      display: grid; place-items: center; background: var(--soft); font-size: 21px; cursor: pointer;
    }
    .live-popup .live-toolbar { display: grid; }
    .live-popup-list { flex: 1 1 auto; min-height: 0; padding-bottom: env(safe-area-inset-bottom); overflow-y: auto; scrollbar-width: none; }
    .live-popup-list::-webkit-scrollbar { display: none; }

    .live-view { min-height: 100%; background: #fff; }
    .live-status-section { border-bottom: 6px solid var(--soft); }
    .live-status-toggle {
      width: 100%; height: 52px; padding: 0 66px 0 16px; border: 0; border-bottom: 1px solid var(--line);
      display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; align-items: center; gap: 10px;
      background: #fff; text-align: left; cursor: pointer;
    }
    .live-status-title { font-size: 17px; font-weight: 750; }
    .live-status-section[data-status="live"] .live-status-title { color: var(--red); }
    .live-status-count {
      min-width: 28px; height: 28px; padding: 0 7px; border-radius: 7px;
      display: grid; place-items: center; background: var(--soft); color: #66686e;
      font-size: 12px; font-weight: 700;
    }
    .live-status-chevron { text-align: center; color: #777980; font-size: 17px; transition: transform .2s ease; }
    .live-status-section.expanded .live-status-chevron { transform: rotate(180deg); }
    .live-status-content { display: none; }
    .live-status-section.expanded .live-status-content { display: block; }
    .live-competition { border-bottom: 5px solid var(--soft); }
    .live-competition-header {
      min-height: 46px; padding: 0 16px; display: flex; align-items: center; gap: 9px;
      border-bottom: 1px solid var(--line); color: #686a70; font-size: 14px; font-weight: 650;
    }
    .live-competition-header .live-count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .live-match-row {
      min-height: 80px; display: grid; grid-template-columns: 48px minmax(0, 1fr) 40px;
      align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line);
      background: #fff; cursor: pointer;
    }
    .live-match-row:last-child { border-bottom: 0; }
    .live-match-row .match-time { border-right: 1px solid var(--line); }
    .live-match-row .match-content { padding: 0 9px; }
    .live-match-row .team-line { height: 30px; }
    .live-match-row .team-name { font-size: 15px; }
    .live-match-row .crest-wrap { width: 24px; height: 24px; }
    .live-match-row .crest { max-width: 23px; max-height: 23px; }
    .live-match-row .score { font-size: 17px; color: var(--ink); }
    .live-match-row[data-status="live"] .score { color: var(--red); }
    .live-match-row .score.pending { color: #9b9da2; font-size: 13px; font-weight: 550; }
    .live-match-row.featured-match {
      padding-left: 5px; border-left: 3px solid var(--red); background: var(--red-soft);
    }
    .all-games-directory { background: #fff; padding-bottom: 78px; }
    .directory-heading {
      min-height: 58px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      border-top: 10px solid var(--soft); border-bottom: 1px solid var(--line);
    }
    .directory-heading h2 { margin: 0; font-size: 20px; font-weight: 760; }
    .directory-heading span { color: var(--muted); font-size: 12px; }
    .all-game-group { border-bottom: 1px solid var(--line); }
    .all-game-toggle {
      width: 100%; min-height: 52px; padding: 0 16px; border: 0; background: #fff;
      display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 26px;
      align-items: center; gap: 10px; text-align: left; cursor: pointer;
    }
    .all-game-toggle.with-crests { grid-template-columns: 34px minmax(0, 1fr) 52px auto 26px; gap: 8px; }
    .all-game-name { min-width: 0; font-size: 15px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hot-team-crests { width: 52px; min-width: 52px; height: 30px; display: flex; align-items: center; justify-content: flex-end; overflow: visible; }
    .hot-team-crest { width: 28px; height: 28px; position: relative; flex: 0 0 28px; }
    .hot-team-crest + .hot-team-crest { margin-left: -8px; }
    .hot-team-crest img {
      width: 100%; height: 100%; object-fit: contain; padding: 2px; border-radius: 50%;
      background: #fff; border: 1px solid #e3e4e8; box-shadow: 0 1px 3px rgba(20,24,32,.10);
    }
    .hot-team-crest.live-team img { border: 2px solid var(--red); background: var(--red-soft); }
    .hot-team-crest.live-team::after {
      content: ""; position: absolute; top: -1px; right: -1px; width: 7px; height: 7px;
      border: 2px solid #fff; border-radius: 50%; background: var(--red);
    }
    .all-game-count { min-width: 29px; height: 29px; padding: 0 7px; border-radius: 7px; display: grid; place-items: center; background: var(--soft); font-size: 13px; font-weight: 650; }
    .all-game-chevron { text-align: center; font-size: 17px; transition: transform .2s ease; }
    .all-game-group.expanded .all-game-chevron { transform: rotate(180deg); }
    .all-game-children { display: none; padding: 0 0 8px; background: #fff; }
    .all-game-group.expanded .all-game-children { display: block; }
    .match-list-item {
      min-height: 66px; padding: 7px 12px 7px 14px;
      display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: center; gap: 8px;
      background: #fff; border-bottom: 1px solid var(--line); color: #2c2d31;
    }
    .match-list-item.hot-match {
      padding-left: 11px; border-left: 3px solid var(--red); background: var(--red-soft);
    }
    .match-list-meta { align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .match-list-meta span { color: #96989e; font-size: 9px; line-height: 1; text-transform: uppercase; }
    .match-list-meta strong { color: #202125; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .match-list-teams { min-width: 0; }
    .match-list-team { min-width: 0; height: 25px; display: flex; align-items: center; gap: 8px; }
    .match-list-team img {
      width: 21px; height: 21px; flex: 0 0 21px; padding: 1px; object-fit: contain;
      border-radius: 50%; background: #fff; border: 1px solid #e1e3e7;
    }
    .match-list-team span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 560; }
    .league-list-item {
      min-height: 44px; margin: 0 16px 0 60px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: #5c5e64; font-size: 13px;
    }
    .league-list-item > span:last-child { color: var(--muted); flex: 0 0 auto; }
    .all-game-child-main { min-width: 0; display: flex; align-items: center; gap: 8px; }
    .all-game-child-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .child-league-badge {
      width: 24px; min-width: 24px; height: 24px; border-radius: 6px;
      display: grid; place-items: center; color: #fff !important;
      font-size: 9px; font-weight: 800; line-height: 1;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding-bottom: 86px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    main::-webkit-scrollbar { display: none; }
    .day-section { scroll-margin-top: 0; }
    .day-divider {
      height: 38px; padding: 0 16px; display: flex; align-items: center; gap: 10px;
      background: #f1f2f5; color: #777980; font-size: 12px; font-weight: 700;
    }
    .day-divider::before, .day-divider::after { content: ""; height: 1px; flex: 1; background: #dfe1e6; }
    .day-divider span { white-space: nowrap; }
    .day-empty { padding: 34px 20px 40px; text-align: center; color: var(--muted); font-size: 13px; }
    .all-view { min-height: 100%; background: #fff; }
    .all-view-header {
      height: 68px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
      border-top: 10px solid var(--soft); border-bottom: 1px solid var(--line); background: #fff;
    }
    .all-view-header h2 { margin: 0; font-size: 21px; font-weight: 760; }
    .all-view-header span { color: var(--muted); font-size: 12px; }
    .region-toggle {
      width: 100%; height: 64px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--line);
      display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 26px; align-items: center; gap: 10px;
      background: #fff; text-align: left; cursor: pointer;
    }
    .region-toggle:active { background: #fafafa; }
    .region-flag { width: 30px; text-align: center; font-size: 23px; line-height: 1; }
    .region-name { min-width: 0; font-size: 16px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .region-count { min-width: 31px; height: 31px; padding: 0 8px; border-radius: 7px; display: grid; place-items: center; background: var(--soft); font-size: 14px; font-weight: 650; }
    .region-chevron { text-align: center; font-size: 18px; transition: transform .2s ease; }
    .region-group.expanded .region-chevron { transform: rotate(180deg); }
    .region-children { display: none; padding: 5px 16px 8px 60px; background: #fafbfc; border-bottom: 1px solid var(--line); }
    .region-group.expanded .region-children { display: block; }
    .region-child { min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #56585e; font-size: 13px; }
    .region-child span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    .competition { border-top: 10px solid var(--soft); }
    .competition-header {
      height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      background: #fff; border-bottom: 1px solid var(--line);
    }
    .competition-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .league-mark {
      width: 25px; height: 25px; border-radius: 7px; display: grid; place-items: center;
      background: #242f59; color: #fff; font-size: 11px; font-weight: 800;
    }
    .competition-title strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .competition-meta { display: flex; align-items: center; gap: 8px; }
    .competition-count { background: var(--soft); min-width: 25px; height: 25px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; }
    .collapse-btn { border: 0; background: transparent; font-size: 17px; cursor: pointer; padding: 6px; transition: transform .2s ease; }
    .competition.collapsed .matches { display: none; }
    .competition.collapsed .collapse-btn { transform: rotate(180deg); }
    .matches { padding: 10px 10px 2px; background: var(--soft); }

    .match-row {
      min-height: 120px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 46px;
      align-items: center;
      padding: 14px 10px 14px 8px;
      background: #fff;
      border: 1px solid #e8e9ed;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      position: relative;
    }
    .match-row:active { background: #fbfbfc; }
    .match-row::before { content: ""; position: absolute; left: -1px; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
    .match-row[data-status="live"]::before { background: var(--red); }
    .match-time { align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--line); }
    .match-time strong { font-size: 15px; }
    .match-time .live { color: var(--red); font-weight: 750; }
    .match-time .ft { color: #65676c; font-weight: 700; }

    .match-content { min-width: 0; padding: 0 13px; }
    .team-line { min-width: 0; height: 36px; display: flex; align-items: center; gap: 10px; }
    .crest-wrap { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; }
    .crest { max-width: 27px; max-height: 27px; object-fit: contain; }
    .team-name { font-size: 16px; font-weight: 590; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { margin-left: auto; font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .match-row[data-status="live"] .score { color: var(--red); }
    .score.pending { font-size: 13px; color: #9b9da2; font-weight: 550; }
    .favorite-btn {
      width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%;
      font-size: 23px; color: #c9cbd0; cursor: pointer;
    }
    .favorite-btn.active { color: #ffb000; }

    .empty { padding: 72px 30px; text-align: center; color: var(--muted); }
    .empty b { display: block; color: #55575c; margin-bottom: 7px; font-size: 16px; }

    .bottom-nav {
      position: absolute; z-index: 20; left: 0; bottom: 0;
      width: 100%;
      height: calc(76px + env(safe-area-inset-bottom));
      padding: 8px 10px calc(7px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: rgba(255,255,255,.96); border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .nav-btn { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #74767b; font-size: 11px; cursor: pointer; }

        btn.classList.toggle('active');
        btn.textContent = btn.classList.contains('active') ? '★' : '☆';
        showToast(btn.classList.contains('active') ? 'Match added to Following' : 'Match removed from Following');
      }));
      matchList.querySelectorAll('.match-row').forEach(row => row.addEventListener('click', () => openSheet(JSON.parse(row.dataset.match))));
      if (scrollToActive) requestAnimationFrame(() => scrollToDate(activeDate, 'auto'));
    }

    function liveMatchTemplate(m) {
      const [, , , status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore] = m;
      const important = isImportantMatch(m);
      const payload = JSON.stringify({ league: m[0], status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore }).replaceAll("'", '&apos;');
      const scoreA = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${homeScore}</span>`;
      const scoreB = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${awayScore}</span>`;
      return `<article class="live-match-row ${important ? 'featured-match' : ''}" data-status="${status}" data-match='${payload}' aria-label="${important ? 'Featured match, ' : ''}${home} versus ${away}">
        <div class="match-time"><strong class="${status === 'live' ? 'live' : status === 'finished' ? 'ft' : ''}">${time}</strong></div>
        <div class="match-content">
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${homeLogo}" alt=""></span><span class="team-name">${home}</span>${scoreA}</div>
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${awayLogo}" alt=""></span><span class="team-name">${away}</span>${scoreB}</div>
        </div>
        <button class="favorite-btn" aria-label="Follow match">☆</button>
      </article>`;
    }

    function renderLive() {
      matchList.innerHTML = allGamesTemplate();
      if (document.getElementById('livePreviewTrack')) bindLivePreview();
      matchList.querySelectorAll('.all-game-toggle').forEach(button => button.addEventListener('click', () => {
        const group = button.closest('.all-game-group');
        const expanded = group.classList.toggle('expanded');
        button.setAttribute('aria-expanded', String(expanded));
      }));
      matchList.scrollTop = 0;
    }

    function bindLiveList(container) {
      container.querySelectorAll('.live-status-toggle').forEach(button => button.addEventListener('click', () => {
        const section = button.closest('.live-status-section');
        const status = section.dataset.status;
        const expanded = section.classList.toggle('expanded');
        liveSectionState[status] = expanded;
        button.setAttribute('aria-expanded', String(expanded));
      }));
      container.querySelectorAll('.live-match-row').forEach(row => row.addEventListener('click', () => {
        closeLivePopup();
        openSheet(JSON.parse(row.dataset.match));
      }));
      container.querySelectorAll('.favorite-btn').forEach(btn => btn.addEventListener('click', event => {
        event.stopPropagation();
        btn.classList.toggle('active');
        btn.textContent = btn.classList.contains('active') ? '★' : '☆';
      }));
    }

    function liveCompetitionGroups(matchesForStatus) {
      const groups = {};
      matchesForStatus.forEach(match => (groups[match[0]] ||= []).push(match));
      return Object.entries(groups).map(([league, matches]) => {
        const meta = matches[0];
        return `<section class="live-competition">
          <header class="live-competition-header"><span class="league-mark" style="background:${meta[2]}">${meta[1]}</span><span>${league}</span><span class="live-count">${matches.length}</span></header>
          ${matches.map(liveMatchTemplate).join('')}
        </section>`;
      }).join('');
    }

    function liveStatusSection(status, label, matches) {
      const expanded = liveSectionState[status];
      return `<section class="live-status-section ${expanded ? 'expanded' : ''}" data-status="${status}">
        <button class="live-status-toggle" aria-expanded="${expanded}">
          <span class="live-status-title">${label}</span>
          <span class="live-status-count">${matches.length}</span>
          <span class="live-status-chevron">⌄</span>
        </button>
        <div class="live-status-content">${liveCompetitionGroups(matches)}</div>
      </section>`;
    }

    function liveStatusTemplate() {
      const upcomingMatches = data['27'].filter(match => match[3] === 'upcoming');
      const finishedMatches = data['26'];
      return `<section class="live-view">
        ${liveStatusSection('upcoming', 'Upcoming', upcomingMatches)}
        ${liveStatusSection('live', 'Live', liveData)}
        ${liveStatusSection('finished', 'Finished', finishedMatches)}
      </section>`;
    }

    let livePopupTrigger = null;

    function openLivePopup(status = 'live', trigger = document.activeElement) {
      Object.keys(liveSectionState).forEach(key => { liveSectionState[key] = key === status; });
      livePopupTrigger = trigger;
      livePopupList.innerHTML = liveStatusTemplate();
      bindLiveList(livePopupList);
      livePopup.classList.add('show');
      livePopupBackdrop.classList.add('show');
      livePopup.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        const target = livePopupList.querySelector(`.live-status-section[data-status="${status}"]`);
        livePopupList.scrollTop = target ? Math.max(0, target.offsetTop - livePopupList.offsetTop) : 0;
      });
      document.getElementById('closeLivePopup').focus();
    }

    function closeLivePopup() {
      livePopup.classList.remove('show');
      livePopupBackdrop.classList.remove('show');
      livePopup.setAttribute('aria-hidden', 'true');
      if (livePopupTrigger?.isConnected) livePopupTrigger.focus();
    }

    function directoryDateLabel() {
      return selectedDate === '27' ? 'TODAY' : `JUL ${selectedDate}`;
    }

    function matchListItemTemplate(child) {
      const [matchName, time, homeLogo, awayLogo, hot] = child;
      const [home, away] = matchName.split(' vs ');
      return `<div class="match-list-item ${hot ? 'hot-match' : ''}"${hot ? ` aria-label="Featured match, ${home} versus ${away}"` : ''}>
        <div class="match-list-meta"><span>${directoryDateLabel()}</span><strong>${time}</strong></div>
        <div class="match-list-teams">
          <div class="match-list-team"><img src="${homeLogo}" alt=""><span>${home}</span></div>
          <div class="match-list-team"><img src="${awayLogo}" alt=""><span>${away}</span></div>
        </div>
      </div>`;
    }

    function leagueListItemTemplate(child, item) {
      return `<div class="league-list-item">
        <span class="all-game-child-main">
          <span class="child-league-badge" style="background:${item.color}">${child[2] || item.mark}</span>
          <span class="all-game-child-name">${child[0]}</span>
        </span>
        <span>${child[1]}</span>
      </div>`;
    }

    function hotTeamCrestTemplate(logo, index, showLiveState) {
      const liveTeam = liveTeamByLogo.get(logo);
      const label = showLiveState ? `${liveTeam} playing live` : `Popular team ${index + 1}`;
      return `<span class="hot-team-crest ${showLiveState ? 'live-team' : ''}" aria-label="${label}">
        <img src="${logo}" alt="">
      </span>`;
    }

    function directoryRows(items) {
      let remainingLiveCrestHighlights = selectedDate === '27' ? 3 : 0;
      return items.map(item => `<section class="all-game-group">
        <button class="all-game-toggle ${item.teams ? 'with-crests' : ''}" aria-expanded="false">
          <span class="league-mark" style="background:${item.color}">${item.mark}</span>
          <span class="all-game-name" title="${item.name}">${item.name}</span>
          ${item.teams ? `<span class="hot-team-crests" aria-label="Popular teams">${item.teams.map((logo, index) => {
            const showLiveState = liveTeamByLogo.has(logo) && remainingLiveCrestHighlights > 0;
            if (showLiveState) remainingLiveCrestHighlights -= 1;
            return hotTeamCrestTemplate(logo, index, showLiveState);
          }).join('')}</span>` : ''}
          <span class="all-game-count">${item.count}</span>
          <span class="all-game-chevron">⌄</span>
        </button>
        <div class="all-game-children">${item.children.map(child => child[2]?.startsWith('assets/')
          ? matchListItemTemplate(child)
          : leagueListItemTemplate(child, item)).join('')}</div>
      </section>`).join('');
    }

    function competitionsForSelectedDate() {
      const profile = competitionDateProfiles[selectedDate] || competitionDateProfiles['27'];
      return allGameCompetitions.map((item, index) => ({
        ...item,
        count: profile.counts[index],
        teams: profile.teams[index].length ? profile.teams[index] : undefined,
        children: competitionMatchPools[item.mark].slice(0, profile.counts[index])
      }));
    }

    function countriesForSelectedDate() {
      const counts = countryDateCounts[selectedDate] || countryDateCounts['27'];
      return allGameCountries.map((item, index) => ({ ...item, count: counts[index] }));
    }

    function livePreviewMatchTemplate(match) {
      const [league, , , , time, , home, homeLogo, away, awayLogo, homeScore, awayScore] = match;
      const important = isImportantMatch(match);
      const payload = JSON.stringify({ league: match[0], status: 'live', time, reason: 'Live', home, homeLogo, away, awayLogo, homeScore, awayScore }).replaceAll("'", '&apos;');
      return `<button class="live-preview-match ${important ? 'featured-match' : ''}" data-match='${payload}' aria-label="${important ? 'Featured match, ' : ''}Open ${home} versus ${away}">
        <span class="live-preview-card-head"><span class="live-preview-league">${league}</span><span class="live-preview-minute">${time}</span></span>
        <span class="live-preview-teams">
          <span class="live-preview-team"><img src="${homeLogo}" alt=""><span>${home}</span><strong>${homeScore}</strong></span>
          <span class="live-preview-team"><img src="${awayLogo}" alt=""><span>${away}</span><strong>${awayScore}</strong></span>
        </span>
      </button>`;
    }

    function livePreviewTemplate() {
      return `<section class="all-games-live-entry" aria-label="Live match preview">
        <div class="live-preview-heading">
          <button class="live-preview-title" data-open-status="live" aria-label="Open ${liveData.length} live matches">Live now <strong>${liveData.length}</strong><span class="live-preview-action">View all <b aria-hidden="true">›</b></span></button>
        </div>
        <div class="live-preview-track" id="livePreviewTrack" aria-label="Swipe through live matches">
          <button class="live-status-entry finished" data-open-status="finished" aria-label="Open finished matches"><strong>← Finished</strong></button>
          ${liveData.map(livePreviewMatchTemplate).join('')}
          <button class="live-status-entry upcoming" data-open-status="upcoming" aria-label="Open upcoming matches"><strong>Upcoming →</strong></button>
        </div>
      </section>`;
    }

    function bindLivePreview() {
      const track = document.getElementById('livePreviewTrack');
      track.querySelectorAll('[data-open-status]').forEach(button => button.addEventListener('click', () => openLivePopup(button.dataset.openStatus, button)));
      document.querySelector('.live-preview-title').addEventListener('click', event => openLivePopup('live', event.currentTarget));
      track.querySelectorAll('.live-preview-match').forEach(button => button.addEventListener('click', () => openSheet(JSON.parse(button.dataset.match))));
      requestAnimationFrame(() => {
        const finishedEntry = track.querySelector('.live-status-entry.finished');
        track.scrollLeft = finishedEntry.offsetWidth + 8;
      });
    }

    function allGamesTemplate() {
      return `${selectedDate === '27' ? livePreviewTemplate() : ''}
      <section class="all-games-directory">
        <header class="directory-heading"><h2>Top Competitions</h2></header>
        ${directoryRows(competitionsForSelectedDate())}
        <header class="directory-heading"><h2>All Competitions</h2></header>
        ${directoryRows(countriesForSelectedDate())}
      </section>`;
    }

    function switchPage(page) {
      if (currentPage === page) return;
      currentPage = page;
      const isLive = page === 'live';
      app.classList.toggle('live-page', isLive);
      liveNav.classList.toggle('active', isLive);
      exploreNav.classList.toggle('active', !isLive);
      liveNav.setAttribute('aria-current', isLive ? 'page' : 'false');
      exploreNav.setAttribute('aria-current', isLive ? 'false' : 'page');
      if (!isLive) closeLivePopup();
      isLive ? renderLive() : renderFeatured();
    }

    let scrollFrame = 0;
    function syncDateFromScroll() {
      scrollFrame = 0;
      if (currentPage !== 'explore') return;
      const sections = [...matchList.querySelectorAll('.day-section')];
      if (!sections.length) return;
      const listRect = matchList.getBoundingClientRect();
      const marker = listRect.top + Math.min(90, listRect.height * 0.24);
      let activeSection = sections[0];
      sections.forEach(section => {
        if (section.getBoundingClientRect().top <= marker) activeSection = section;
      });
      if (matchList.scrollTop + matchList.clientHeight >= matchList.scrollHeight - 2) {
        activeSection = sections[sections.length - 1];
      }
      setActiveDate(activeSection.dataset.date);
    }

    matchList.addEventListener('scroll', () => {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(syncDateFromScroll);
    }, { passive: true });

    function matchTemplate(m) {
      const [, , , status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore] = m;
      const scoreA = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${homeScore}</span>`;
      const scoreB = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${awayScore}</span>`;
      const payload = JSON.stringify({ league: m[0], status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore }).replaceAll("'", '&apos;');
      return `<article class="match-row" data-status="${status}" data-match='${payload}'>
        <div class="match-time"><strong class="${status === 'live' ? 'live' : status === 'finished' ? 'ft' : ''}">${time}</strong></div>
        <div class="match-content">
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${homeLogo}" alt=""></span><span class="team-name">${home}</span>${scoreA}</div>
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${awayLogo}" alt=""></span><span class="team-name">${away}</span>${scoreB}</div>
        </div>
        <button class="favorite-btn" aria-label="Follow match">☆</button>
      </article>`;
    }

    liveNav.addEventListener('click', () => {
      if (currentPage === 'live' && livePopup.classList.contains('show')) closeLivePopup();
      else switchPage('live');
    });
    exploreNav.addEventListener('click', () => switchPage('explore'));
    document.getElementById('sortLiveBtn').addEventListener('click', () => showToast('Games grouped by competition'));
    document.getElementById('liveSearchBtn').addEventListener('click', () => showToast('Search live matches'));
    document.getElementById('closeLivePopup').addEventListener('click', closeLivePopup);
    livePopupBackdrop.addEventListener('click', closeLivePopup);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && livePopup.classList.contains('show')) closeLivePopup();
    });

    const sheet = document.getElementById('sheet');
    const scrim = document.getElementById('scrim');
    function openSheet(m) {
      document.getElementById('sheetLeague').textContent = m.league;
      document.getElementById('sheetHome').textContent = m.home;
      document.getElementById('sheetAway').textContent = m.away;
      document.getElementById('sheetHomeLogo').src = m.homeLogo;
      document.getElementById('sheetAwayLogo').src = m.awayLogo;
      document.getElementById('sheetScore').textContent = m.status === 'upcoming' ? m.time : `${m.homeScore} - ${m.awayScore}`;
      document.getElementById('sheetStatus').textContent = m.status === 'live' ? `${m.time} Live` : m.status === 'finished' ? 'Finished' : 'Upcoming';
      document.getElementById('sheetReason').innerHTML = currentPage === 'live'
        ? '<strong>Live now</strong><br>Follow this match for score changes and key-event alerts.'
        : `<strong>Why it is featured: ${m.reason}</strong><br>This match is prioritised for quick access to the score, status and key events.`;
      sheet.classList.add('show'); scrim.classList.add('show'); sheet.setAttribute('aria-hidden', 'false');
    }
    function closeSheet() { sheet.classList.remove('show'); scrim.classList.remove('show'); sheet.setAttribute('aria-hidden', 'true'); }
    document.getElementById('closeSheet').addEventListener('click', closeSheet);
    scrim.addEventListener('click', closeSheet);
    document.getElementById('detailBtn').addEventListener('click', () => { closeSheet(); showToast('Opening Match Centre · Demo'); });
    let toastTimer;
    function showToast(message) {
      toast.textContent = message; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    drawDates();
    renderFeatured();
  </script>
</body>
</html>
