    const variantInlineTab = document.getElementById('variantInlineTab');
    const variantControlTab = document.getElementById('variantControlTab');
    const livePopup = document.getElementById('livePopup');
    const livePopupBackdrop = document.getElementById('livePopupBackdrop');
    const livePopupList = document.getElementById('livePopupList');
    const toast = document.getElementById('toast');

    function drawDates() {
      dateStrip.innerHTML = dates.map(d => `
        <button class="date-btn ${d.key === selectedDate ? 'active' : ''}" data-date="${d.key}">
          <span>${d.dow}</span><strong>${d.day}</strong>
        </button>`).join('') + '<button class="date-calendar" aria-label="Choose date" title="Choose date"><span class="date-calendar-icon" aria-hidden="true"></span></button>';
      dateStrip.querySelectorAll('.date-btn').forEach(btn => btn.addEventListener('click', () => {
        selectDate(btn.dataset.date);
      }));
      dateStrip.querySelector('.date-calendar')?.addEventListener('click', () => showToast('Calendar · Demo'));
    }

    function setActiveDate(key) {
      if (selectedDate === key) return;
      selectedDate = key;
      drawDates();
    }

    function selectDate(key) {
      setActiveDate(key);
      if (currentPage === 'live') {
        if (selectedDate !== '27' && livePopup.classList.contains('show')) closeLivePopup();
        renderLive();
        return;
      }
      if (currentPage === 'live-list') {
        renderStandaloneLive();
        return;
      }
      scrollToDate(key, 'smooth');
    }

    function scrollToDate(key, behavior = 'smooth') {
      const section = matchList.querySelector(`.day-section[data-date="${key}"]`);
      if (!section) return;
      const listRect = matchList.getBoundingClientRect();
      const sectionRect = section.getBoundingClientRect();
      const targetTop = matchList.scrollTop + sectionRect.top - listRect.top;
      matchList.scrollTo({ top: targetTop, behavior });
    }

    function dayTemplate(date) {
      const dayData = data[date.key] || [];
      const visible = dayData;
      const dateLabel = date.key === '27' ? 'Today · Jul 27' : `${date.dow} · Jul ${date.day}`;
      if (!visible.length) {
        return `<section class="day-section" data-date="${date.key}">
          <div class="day-divider"><span>${dateLabel}</span></div>
          <div class="day-empty">No matches in this filter</div>
        </section>`;
      }

      const groups = {};
      visible.forEach(m => (groups[m[0]] ||= []).push(m));
      const competitions = Object.entries(groups).map(([league, matches]) => {
        const meta = matches[0];
        return `<section class="competition">
          <header class="competition-header">
            <div class="competition-title"><span class="league-mark" style="background:${meta[2]}">${meta[1]}</span><strong>${league}</strong></div>
            <div class="competition-meta"><span class="competition-count">${matches.length}</span><button class="collapse-btn" aria-label="Collapse or expand">⌃</button></div>
          </header>
          <div class="matches">${matches.map(matchTemplate).join('')}</div>
        </section>`;
      }).join('');

      return `<section class="day-section" data-date="${date.key}">
        <div class="day-divider"><span>${dateLabel}</span></div>
        ${competitions}
      </section>`;
    }

    function renderFeatured(scrollToActive = true) {
      const activeDate = selectedDate;
      matchList.innerHTML = dates.map(dayTemplate).join('');

      matchList.querySelectorAll('.collapse-btn').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        btn.closest('.competition').classList.toggle('collapsed');
      }));
      matchList.querySelectorAll('.favorite-btn').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        btn.classList.toggle('active');
        btn.textContent = btn.classList.contains('active') ? '★' : '☆';
        showToast(btn.classList.contains('active') ? 'Match added to Following' : 'Match removed from Following');
      }));
      matchList.querySelectorAll('.match-row').forEach(row => row.addEventListener('click', () => openSheet(JSON.parse(row.dataset.match))));
      if (scrollToActive) requestAnimationFrame(() => scrollToDate(activeDate, 'auto'));
    }

    function liveMatchTemplate(m) {
      const [, , , status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore] = m;
      const important = isImportantMatch(m);
      const payload = JSON.stringify({ league: m[0], status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore }).replaceAll("'", '&apos;');
      const scoreA = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${homeScore}</span>`;
      const scoreB = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${awayScore}</span>`;
      return `<article class="live-match-row ${important ? 'featured-match' : ''}" data-status="${status}" data-match='${payload}' aria-label="${important ? 'Featured match, ' : ''}${home} versus ${away}">
        <div class="match-time"><strong class="${status === 'live' ? 'live' : status === 'finished' ? 'ft' : ''}">${time}</strong></div>
        <div class="match-content">
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${homeLogo}" alt=""></span><span class="team-name">${home}</span>${scoreA}</div>
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${awayLogo}" alt=""></span><span class="team-name">${away}</span>${scoreB}</div>
        </div>
        <button class="favorite-btn" aria-label="Follow match">☆</button>
      </article>`;
    }

    function renderLive() {
      matchList.innerHTML = allGamesTemplate();
      if (document.getElementById('livePreviewTrack')) bindLivePreview();
      if (document.querySelector('.all-games-redesign-view')) bindRedesignedAllGames();
      matchList.querySelectorAll('.all-game-toggle').forEach(button => button.addEventListener('click', () => {
        const group = button.closest('.all-game-group');
        const expanded = group.classList.toggle('expanded');
        button.setAttribute('aria-expanded', String(expanded));
      }));
      matchList.scrollTop = 0;
    }

    function bindLiveList(container) {
      container.querySelectorAll('.live-status-toggle').forEach(button => button.addEventListener('click', () => {
        const section = button.closest('.live-status-section');
        const status = section.dataset.status;
        const expanded = section.classList.toggle('expanded');
        liveSectionState[status] = expanded;
        button.setAttribute('aria-expanded', String(expanded));
      }));
      container.querySelectorAll('.live-match-row').forEach(row => row.addEventListener('click', () => {
        closeLivePopup();
        openSheet(JSON.parse(row.dataset.match));
      }));
      container.querySelectorAll('.favorite-btn').forEach(btn => btn.addEventListener('click', event => {
        event.stopPropagation();
        btn.classList.toggle('active');
        btn.textContent = btn.classList.contains('active') ? '★' : '☆';
      }));
    }

    function liveCompetitionGroups(matchesForStatus) {
      const groups = {};
      matchesForStatus.forEach(match => (groups[match[0]] ||= []).push(match));
      return Object.entries(groups).map(([league, matches]) => {
        const meta = matches[0];
        const logo = liveLeagueLogos[league];
        const leagueMark = logo
          ? `<span class="league-mark league-logo"><img src="${logo}" alt=""></span>`
          : `<span class="league-mark" style="background:${meta[2]}">${meta[1]}</span>`;
        return `<section class="live-competition">
          <header class="live-competition-header">${leagueMark}<span>${league}</span><span class="live-count">${matches.length}</span></header>
          ${matches.map(liveMatchTemplate).join('')}
        </section>`;
      }).join('');
    }

    function standaloneLiveTemplate() {
      const matches = selectedDate === '27' ? liveData : [];
      return `<section class="standalone-live-view" aria-label="Live matches list">
        <header class="standalone-live-summary">
          <button class="standalone-live-back" id="backToAllGames" aria-label="Back to Matches">‹</button>
          <span class="standalone-live-dot" aria-hidden="true"></span>
          <h2>Live matches</h2>
          <span class="standalone-live-total">${matches.length}</span>
        </header>
        <section class="standalone-live-toolbar" aria-label="Live match tools">
          <button class="standalone-live-tool" id="standaloneSortLive"><span class="clock-glyph" aria-hidden="true"></span><span>By time</span></button>
          <button class="standalone-live-tool" id="standaloneSearchLive"><span class="search-glyph" aria-hidden="true">⌕</span><span>Search</span></button>
          <button class="standalone-live-tool filter" id="standaloneFilterLive" aria-label="Filter live matches"><span class="filter-glyph" aria-hidden="true"></span></button>
        </section>
        ${matches.length
          ? liveStatusTemplate()
          : '<div class="standalone-live-empty"><b>No live matches</b><span>Live matches are available on Today.</span></div>'}
      </section>`;
    }

    function renderStandaloneLive() {
      closeLivePopup();
      matchList.innerHTML = standaloneLiveTemplate();
      document.getElementById('backToAllGames')?.addEventListener('click', navigateToAllGames);
      document.getElementById('standaloneSortLive')?.addEventListener('click', () => showToast('Games sorted by time'));
      document.getElementById('standaloneSearchLive')?.addEventListener('click', () => showToast('Search live matches'));
      document.getElementById('standaloneFilterLive')?.addEventListener('click', () => showToast('Filter live matches'));
      bindLiveList(matchList);
      matchList.scrollTop = 0;
    }

    function liveStatusSection(status, label, matches) {
      const expanded = liveSectionState[status];
      return `<section class="live-status-section ${expanded ? 'expanded' : ''}" data-status="${status}">
        <button class="live-status-toggle" aria-expanded="${expanded}">
          <span class="live-status-title">${label}</span>
          <span class="live-status-count">${matches.length}</span>
          <span class="live-status-chevron">⌄</span>
        </button>
        <div class="live-status-content">${liveCompetitionGroups(matches)}</div>
      </section>`;
    }

    function liveStatusTemplate() {
      const upcomingMatches = data['27'].filter(match => match[3] === 'upcoming');
      const finishedMatches = data['26'];
      return `<section class="live-view">
        ${liveStatusSection('finished', 'Finished', finishedMatches)}
        ${liveStatusSection('live', 'Live', liveData)}
        ${liveStatusSection('upcoming', 'Upcoming', upcomingMatches)}
      </section>`;
    }

    let livePopupTrigger = null;

    function openLivePopup(status = 'live', trigger = document.activeElement) {
      Object.keys(liveSectionState).forEach(key => { liveSectionState[key] = key === status; });
      livePopupTrigger = trigger;
      livePopupList.innerHTML = liveStatusTemplate();
      bindLiveList(livePopupList);
      livePopup.classList.add('show');
      livePopupBackdrop.classList.add('show');
      livePopup.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        const target = livePopupList.querySelector(`.live-status-section[data-status="${status}"]`);
        livePopupList.scrollTop = target ? Math.max(0, target.offsetTop - livePopupList.offsetTop) : 0;
      });
      document.getElementById('closeLivePopup').focus();
    }

    function closeLivePopup() {
      livePopup.classList.remove('show');
      livePopupBackdrop.classList.remove('show');
      livePopup.setAttribute('aria-hidden', 'true');
      if (livePopupTrigger?.isConnected) livePopupTrigger.focus();
    }

    function directoryDateLabel() {
      return selectedDate === '27' ? 'TODAY' : `JUL ${selectedDate}`;
    }

    function matchListItemTemplate(child) {
      const [matchName, time, homeLogo, awayLogo, hot] = child;
      const [home, away] = matchName.split(' vs ');
      return `<div class="match-list-item ${hot ? 'hot-match' : ''}"${hot ? ` aria-label="Featured match, ${home} versus ${away}"` : ''}>
        <div class="match-list-meta"><span>${directoryDateLabel()}</span><strong>${time}</strong></div>
        <div class="match-list-teams">
          <div class="match-list-team"><img src="${homeLogo}" alt=""><span>${home}</span></div>
          <div class="match-list-team"><img src="${awayLogo}" alt=""><span>${away}</span></div>
        </div>
      </div>`;
    }

    function leagueListItemTemplate(child, item) {
      return `<div class="league-list-item">
        <span class="all-game-child-main">
          <span class="child-league-badge" style="background:${item.color}">${child[2] || item.mark}</span>
          <span class="all-game-child-name">${child[0]}</span>
        </span>
        <span>${child[1]}</span>
      </div>`;
    }

    function hotTeamCrestTemplate(logo, index, status, teamName) {
      const stateClass = status === 'live' ? 'live-team' : status === 'finished' ? 'finished-team' : '';
      const label = status === 'live'
        ? `${teamName} playing live`
        : status === 'finished'
          ? `${teamName} match finished`
          : `Popular team ${index + 1}`;
      return `<span class="hot-team-crest ${stateClass}" data-team-status="${status || 'upcoming'}" aria-label="${label}">
        <img src="${logo}" alt="">
        ${status === 'live' ? '<span class="live-wave" aria-hidden="true"><i></i><i></i><i></i></span>' : ''}
      </span>`;
    }

    function directoryMarkTemplate(item) {
      if (item.logo) return `<span class="league-mark league-logo"><img src="${item.logo}" alt=""></span>`;
      if (item.flag) return `<span class="league-mark country-flag"><img src="${item.flag}" alt=""></span>`;
      return `<span class="league-mark" style="background:${item.color}">${item.mark}</span>`;
    }

    function directoryRows(items) {
      let remainingLiveCrestHighlights = selectedDate === '27' ? 3 : 0;
      let remainingFinishedCrestHighlights = 2;
      const finishedTeamByLogo = new Map((data[selectedDate] || [])
        .filter(match => match[3] === 'finished')
        .flatMap(match => [[match[7], match[6]], [match[9], match[8]]]));
      return items.map(item => `<section class="all-game-group">
        <button class="all-game-toggle ${item.teams ? 'with-crests' : ''}" aria-expanded="false">
          ${directoryMarkTemplate(item)}
          <span class="all-game-name" title="${item.name}">${item.name}</span>
          ${item.teams ? `<span class="hot-team-crests" aria-label="Popular teams">${item.teams.map((logo, index) => {
            const hasLiveState = selectedDate === '27' && liveTeamByLogo.has(logo);
            const showLiveState = hasLiveState && remainingLiveCrestHighlights > 0;
            const showFinishedState = !hasLiveState && finishedTeamByLogo.has(logo) && remainingFinishedCrestHighlights > 0;
            if (showLiveState) remainingLiveCrestHighlights -= 1;
            if (showFinishedState) remainingFinishedCrestHighlights -= 1;
            const status = showLiveState ? 'live' : showFinishedState ? 'finished' : '';
            const teamName = liveTeamByLogo.get(logo) || finishedTeamByLogo.get(logo);
            return hotTeamCrestTemplate(logo, index, status, teamName);
          }).join('')}</span>` : ''}
          <span class="all-game-count">${item.count}</span>
          <span class="all-game-chevron">⌄</span>
        </button>
        <div class="all-game-children">${item.children.map(child => child[2]?.startsWith('assets/')
          ? matchListItemTemplate(child)
          : leagueListItemTemplate(child, item)).join('')}</div>
      </section>`).join('');
    }

    function competitionsForSelectedDate() {
      const profile = competitionDateProfiles[selectedDate] || competitionDateProfiles['27'];
      return allGameCompetitions.map((item, index) => ({
        ...item,
        count: profile.counts[index],
        teams: profile.teams[index].length ? profile.teams[index] : undefined,
        children: competitionMatchPools[item.mark].slice(0, profile.counts[index])
      }));
    }

    function countriesForSelectedDate() {
      const counts = countryDateCounts[selectedDate] || countryDateCounts['27'];
      return allGameCountries.map((item, index) => ({ ...item, count: counts[index] }));
    }

    function livePreviewMatchTemplate(match) {
      const [league, , , , time, , home, homeLogo, away, awayLogo, homeScore, awayScore] = match;
      const leagueLogo = liveLeagueLogos[league];
      const payload = JSON.stringify({ league: match[0], status: 'live', time, reason: 'Live', home, homeLogo, away, awayLogo, homeScore, awayScore }).replaceAll("'", '&apos;');
      return `<button class="live-preview-match" data-match='${payload}' aria-label="Open ${home} versus ${away}">
        <span class="live-preview-card-head">${leagueLogo ? `<span class="live-preview-league-mark" aria-hidden="true"><img src="${leagueLogo}" alt=""></span>` : ''}<span class="live-preview-league">${league}</span><span class="live-preview-minute">${time}</span></span>
        <span class="live-preview-teams">
          <span class="live-preview-team"><img src="${homeLogo}" alt=""><span>${home}</span><strong>${homeScore}</strong></span>
          <span class="live-preview-team"><img src="${awayLogo}" alt=""><span>${away}</span><strong>${awayScore}</strong></span>
        </span>
      </button>`;
    }

    function livePreviewTemplate() {
      return `<section class="all-games-live-entry" aria-label="Live match preview">
        <div class="live-preview-heading">
          <a class="live-preview-title" id="openStandaloneLive" href="${standaloneLiveHref('live').replaceAll('&', '&amp;')}" aria-label="Open ${liveData.length} live matches">Live now <strong>${liveData.length}</strong><span class="live-preview-action">View all <b aria-hidden="true">›</b></span></a>
        </div>
        <div class="live-preview-track" id="livePreviewTrack" aria-label="Swipe through live matches">
          <button class="live-status-entry finished" data-open-status="finished" aria-label="Open finished matches"><strong>← Finished</strong></button>
          ${liveData.map(livePreviewMatchTemplate).join('')}
          <button class="live-status-entry upcoming" data-open-status="upcoming" aria-label="Open upcoming matches"><strong>Upcoming →</strong></button>
        </div>
      </section>`;
    }

    function bindLivePreview() {
      const track = document.getElementById('livePreviewTrack');
      track.querySelectorAll('[data-open-status]').forEach(button => button.addEventListener('click', () => openStandaloneLive(button.dataset.openStatus)));
      track.querySelectorAll('.live-preview-match').forEach(button => button.addEventListener('click', () => openSheet(JSON.parse(button.dataset.match))));
      requestAnimationFrame(() => {
        const finishedEntry = track.querySelector('.live-status-entry.finished');
        track.scrollLeft = finishedEntry.offsetWidth + 8;
      });
    }

    function redesignedCardTemplate(card) {
      const payload = JSON.stringify({
        league: card.league,
        status: card.status,
        time: card.status === 'finished' ? 'FT' : card.result,
        reason: card.reason,
        home: card.home,
        homeLogo: card.homeLogo,
        away: card.away,
        awayLogo: card.awayLogo,
        homeScore: card.status === 'finished' ? card.result.split(' - ')[0] : '',
        awayScore: card.status === 'finished' ? card.result.split(' - ')[1] : ''
      }).replaceAll("'", '&apos;');
      return `<button class="redesign-card theme-${card.theme}" data-match='${payload}' aria-label="Open ${card.home} versus ${card.away}">
        <span class="redesign-card-league">${card.league}</span>
        <span class="redesign-card-teams">
          <span class="redesign-card-team"><img src="${card.homeLogo}" alt=""><span>${card.home}</span></span>
          <span class="redesign-card-team"><img src="${card.awayLogo}" alt=""><span>${card.away}</span></span>
        </span>
        <span class="redesign-card-result ${card.status === 'upcoming' ? 'upcoming' : ''}">${card.result}</span>
        <span class="redesign-card-sub">${card.sub}</span>
      </button>`;
    }

    function redesignedCompetitionTemplate(item, index) {
      return `<section class="redesign-competition-group">
        <button class="redesign-competition-row" data-redesign-competition="${index}" aria-label="Open ${item.name}">
          <span class="redesign-competition-logo"><img src="${item.logo}" alt=""></span>
          <span class="redesign-competition-name" title="${item.name}">${item.name}</span>
          <span class="redesign-competition-count">${item.counts[Number(selectedDate) - 26] || item.counts[1]}</span>
          <span class="redesign-competition-chevron" aria-hidden="true">›</span>
        </button>
      </section>`;
    }

    function redesignedRegionMark(region) {
      if (region.flag) return `<span class="redesign-flag"><img src="${region.flag}" alt=""></span>`;
      return `<span class="redesign-region-mark ${region.region}" aria-hidden="true"></span>`;
    }

    function redesignedRegionTemplate(region, index) {
      const dateIndex = Math.max(0, Math.min(4, Number(selectedDate) - 26));
      return `<section class="redesign-region-group">
        <button class="redesign-region-row" data-redesign-region="${index}" aria-expanded="false">
          ${redesignedRegionMark(region)}
          <span class="redesign-region-name">${region.name}</span>
          <span class="redesign-region-count">${region.counts[dateIndex]}</span>
          <span class="redesign-region-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="redesign-region-children">${region.children.map(child => `<div class="redesign-region-child"><span>${child[0]}</span><span>${child[1]}</span></div>`).join('')}</div>
      </section>`;
    }

    function redesignedAllGamesTemplate() {
      return `<section class="all-games-redesign-view" aria-label="Matches">
        ${experimentVariant !== 'control' && selectedDate === '27' ? livePreviewTemplate() : ''}
        <section class="redesign-competition-list" aria-label="Top competitions">${redesignedTopCompetitions.map(redesignedCompetitionTemplate).join('')}</section>
        <section class="redesign-all-competitions" aria-label="All Competitions">
          <header class="redesign-all-heading"><h2>All Competitions</h2></header>
          ${redesignedRegions.map(redesignedRegionTemplate).join('')}
        </section>
      </section>`;
    }

    function bindRedesignedAllGames() {
      document.querySelectorAll('.redesign-competition-row').forEach(button => button.addEventListener('click', () => {
        showToast(`${button.querySelector('.redesign-competition-name')?.textContent || 'Competition'} · Demo`);
      }));
      document.querySelectorAll('.redesign-region-row').forEach(button => button.addEventListener('click', () => {
        const group = button.closest('.redesign-region-group');
        const expanded = group.classList.toggle('expanded');
        button.setAttribute('aria-expanded', String(expanded));
      }));
    }

    function allGamesTemplate() {
      return redesignedAllGamesTemplate();
    }

    function navigateToAllGames() {
      const params = new URLSearchParams({ view: 'all', date: selectedDate });
      if (experimentVariant === 'control') params.set('variant', 'control');
      window.location.assign(`?${params.toString()}`);
    }

    function standaloneLiveHref(status = 'live') {
      const params = new URLSearchParams({ view: 'live', date: selectedDate });
      if (status !== 'live') params.set('status', status);
      if (experimentVariant === 'control') params.set('variant', 'control');
      return `?${params.toString()}`;
    }

    function openStandaloneLive(status = 'live') {
      const liveUrl = standaloneLiveHref(status);
      window.location.assign(liveUrl);
    }

    function updateVariantTabs() {
      const isControl = experimentVariant === 'control';
      variantInlineTab.classList.toggle('active', !isControl);
      variantControlTab.classList.toggle('active', isControl);
      variantInlineTab.setAttribute('aria-selected', String(!isControl));
      variantControlTab.setAttribute('aria-selected', String(isControl));
    }

    function switchVariant(nextVariant) {
      const params = new URLSearchParams(location.search);
      if (!params.get('view')) params.set('view', currentPage === 'live-list' ? 'live' : currentPage === 'live' ? 'all' : 'featured');
      params.set('date', selectedDate);
      if (nextVariant === 'control') params.set('variant', 'control');
      else params.delete('variant');
      window.location.assign(`?${params.toString()}`);
    }

    function switchPage(page) {
      if (currentPage === page) return;
      currentPage = page;
      const isAllGames = page === 'live';
      const isFeatured = page === 'explore';
      const isLiveList = page === 'live-list';
      const liveTabIsControl = experimentVariant === 'control';
      app.classList.toggle('live-page', isAllGames);
      app.classList.toggle('live-list-page', isLiveList);
      app.classList.toggle('all-games-redesign', isAllGames || isLiveList);
      liveNav.classList.toggle('active', isAllGames || (isLiveList && !liveTabIsControl));
      exploreNav.classList.toggle('active', isFeatured);
      standaloneLiveNav.classList.toggle('active', isLiveList && liveTabIsControl);
      liveNav.setAttribute('aria-current', isAllGames || (isLiveList && !liveTabIsControl) ? 'page' : 'false');
      exploreNav.setAttribute('aria-current', isFeatured ? 'page' : 'false');
      standaloneLiveNav.setAttribute('aria-current', isLiveList && liveTabIsControl ? 'page' : 'false');
      if (!isAllGames) closeLivePopup();
      if (isAllGames) renderLive();
      else if (isLiveList) renderStandaloneLive();
      else renderFeatured();
    }

    let scrollFrame = 0;
    function syncDateFromScroll() {
      scrollFrame = 0;
      if (currentPage !== 'explore') return;
      const sections = [...matchList.querySelectorAll('.day-section')];
      if (!sections.length) return;
      const listRect = matchList.getBoundingClientRect();
      const marker = listRect.top + Math.min(90, listRect.height * 0.24);
      let activeSection = sections[0];
      sections.forEach(section => {
        if (section.getBoundingClientRect().top <= marker) activeSection = section;
      });
      if (matchList.scrollTop + matchList.clientHeight >= matchList.scrollHeight - 2) {
        activeSection = sections[sections.length - 1];
      }
      setActiveDate(activeSection.dataset.date);
    }

    matchList.addEventListener('scroll', () => {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(syncDateFromScroll);
    }, { passive: true });

    function matchTemplate(m) {
      const [, , , status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore] = m;
      const scoreA = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${homeScore}</span>`;
      const scoreB = status === 'upcoming' ? '<span class="score pending">-</span>' : `<span class="score">${awayScore}</span>`;
      const payload = JSON.stringify({ league: m[0], status, time, reason, home, homeLogo, away, awayLogo, homeScore, awayScore }).replaceAll("'", '&apos;');
      return `<article class="match-row" data-status="${status}" data-match='${payload}'>
        <div class="match-time"><strong class="${status === 'live' ? 'live' : status === 'finished' ? 'ft' : ''}">${time}</strong></div>
        <div class="match-content">
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${homeLogo}" alt=""></span><span class="team-name">${home}</span>${scoreA}</div>
          <div class="team-line"><span class="crest-wrap"><img class="crest" src="${awayLogo}" alt=""></span><span class="team-name">${away}</span>${scoreB}</div>
        </div>
        <button class="favorite-btn" aria-label="Follow match">☆</button>
      </article>`;
    }

    liveNav.addEventListener('click', () => {
      if (currentPage === 'live-list') {
        navigateToAllGames();
        return;
      }
      if (currentPage === 'live' && livePopup.classList.contains('show')) closeLivePopup();
      else switchPage('live');
    });
    exploreNav.addEventListener('click', () => {
      if (currentPage === 'live-list') {
        const params = new URLSearchParams({ view: 'featured', date: selectedDate });
        if (experimentVariant === 'control') params.set('variant', 'control');
        window.location.assign(`?${params.toString()}`);
        return;
      }
      switchPage('explore');
    });
    standaloneLiveNav.addEventListener('click', () => {
      if (currentPage !== 'live-list') openStandaloneLive('live');
    });
    variantInlineTab.addEventListener('click', () => switchVariant('inline'));
    variantControlTab.addEventListener('click', () => switchVariant('control'));
    document.querySelector('.search-action').addEventListener('click', () => showToast(currentPage === 'live-list' ? 'Search live matches' : 'Search matches'));
    document.getElementById('sortLiveBtn').addEventListener('click', () => showToast('Games grouped by competition'));
    document.getElementById('liveSearchBtn').addEventListener('click', () => showToast('Search live matches'));
    document.getElementById('closeLivePopup').addEventListener('click', closeLivePopup);
    livePopupBackdrop.addEventListener('click', closeLivePopup);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && livePopup.classList.contains('show')) closeLivePopup();
    });

    const sheet = document.getElementById('sheet');
    const scrim = document.getElementById('scrim');
    function openSheet(m) {
      document.getElementById('sheetLeague').textContent = m.league;
      document.getElementById('sheetHome').textContent = m.home;
      document.getElementById('sheetAway').textContent = m.away;
      document.getElementById('sheetHomeLogo').src = m.homeLogo;
      document.getElementById('sheetAwayLogo').src = m.awayLogo;
      document.getElementById('sheetScore').textContent = m.status === 'upcoming' ? m.time : `${m.homeScore} - ${m.awayScore}`;
      document.getElementById('sheetStatus').textContent = m.status === 'live' ? `${m.time} Live` : m.status === 'finished' ? 'Finished' : 'Upcoming';
      document.getElementById('sheetReason').innerHTML = m.status === 'live'
        ? '<strong>Live now</strong><br>Follow this match for score changes and key-event alerts.'
        : `<strong>Why it is featured: ${m.reason}</strong><br>This match is prioritised for quick access to the score, status and key events.`;
      sheet.classList.add('show'); scrim.classList.add('show'); sheet.setAttribute('aria-hidden', 'false');
    }
    function closeSheet() { sheet.classList.remove('show'); scrim.classList.remove('show'); sheet.setAttribute('aria-hidden', 'true'); }
    document.getElementById('closeSheet').addEventListener('click', closeSheet);
    scrim.addEventListener('click', closeSheet);
    document.getElementById('detailBtn').addEventListener('click', () => { closeSheet(); showToast('Opening Match Centre · Demo'); });
    let toastTimer;
    function showToast(message) {
      toast.textContent = message; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function applyPreviewState() {
      const view = previewParams.get('view') || 'featured';
      const action = previewParams.get('action');
      const requestedStatus = previewParams.get('status');
      app.classList.toggle('control-variant', experimentVariant === 'control');
      updateVariantTabs();
      if (['finished', 'live', 'upcoming'].includes(requestedStatus)) {
        Object.keys(liveSectionState).forEach(key => { liveSectionState[key] = key === requestedStatus; });
      }
      if (view === 'all') switchPage('live');
      else if (view === 'live') switchPage('live-list');
      else renderFeatured();

      requestAnimationFrame(() => {
        if (action === 'live-popup') {
          document.getElementById('openStandaloneLive')?.click();
          return;
        }
        if (action === 'expand-ucl') {
          const group = [...matchList.querySelectorAll('.all-game-group')]
            .find(item => item.querySelector('.all-game-name')?.textContent.startsWith('UEFA Champions'));
          group?.querySelector('.all-game-toggle')?.click();
          if (group) matchList.scrollTop = Math.max(0, group.offsetTop - 210);
          return;
        }
        if (action === 'all-competitions') {
          const heading = [...matchList.querySelectorAll('.directory-heading')]
            .find(item => item.textContent.includes('All Competitions'));
          if (heading) matchList.scrollTop = Math.max(0, heading.offsetTop - 12);
          const country = heading?.nextElementSibling;
          country?.querySelector('.all-game-toggle')?.click();
          return;
        }
        if (action === 'featured-detail') {
          matchList.querySelector('.match-row')?.click();
        }
      });
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && sheet.classList.contains('show')) closeSheet();
    });

    drawDates();
    applyPreviewState();
  </script>
</body>
</html>
